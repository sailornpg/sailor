name: Release

# Building the release artifacts needs macOS and Windows runners, so this workflow
# replaces the local `pnpm run release` path for tag-based releases. Pushing a `v*` tag
# builds on both runners and uploads the artifacts to a draft GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
    env:
      # Husky hooks are useless on a runner and its `prepare` script has nothing to do here.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned pnpm version from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer, main and preload
        run: pnpm run build

      - name: Package ${{ matrix.platform }} artifacts
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Artifact names embed the package version, so a mismatched tag would ship
      # `Sailor-0.1.0-*.dmg` under a `v0.2.0` release.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version $expected" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "Sailor $TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
