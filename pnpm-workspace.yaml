allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  electron: true
  electron-winstaller: true
  esbuild: true
  node-liblzma: false
  # node-pty ships Node-API prebuilds (darwin-arm64) in the tarball; its install
  # script only verifies/removes them, so Sailor deliberately skips native builds.
  node-pty: false
  protobufjs: false
patchedDependencies:
  '@ai-sdk/harness-pi@1.0.119': patches/@ai-sdk__harness-pi@1.0.119.patch
